name: Build and Push

on:
  push:
    branches: [main]

permissions:
  contents: write     # to commit the image-tag bump back to the repo
  packages: write     # to push the image to GHCR

env:
  IMAGE: ghcr.io/amine-lg/aim-duel   # GHCR paths must be lowercase

jobs:
  build-push:
    # don't loop on the workflow's own tag-bump commit
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile      # this repo uses Containerfile, not Dockerfile
          push: true
          # Immutable SHA tag only — no :latest. The cluster runs the exact
          # commit (kustomize pins newTag below), so a mutable tag is never used.
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Bump the deployed image tag
        run: |
          sed -i "s|newTag: .*|newTag: ${GITHUB_SHA}|" k8s/kustomization.yaml

      - name: Commit the tag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- k8s/kustomization.yaml; then
            echo "tag already current"
          else
            git add k8s/kustomization.yaml
            git commit -m "chore: deploy ${GITHUB_SHA} [skip ci]"
            git push
          fi
