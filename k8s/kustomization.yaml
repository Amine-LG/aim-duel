apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aim-duel

resources:
  - 00-namespace.yaml
  - 01-deployment.yaml
  - 02-service.yaml
  - 03-ingress.yaml

# Single source of truth for the image. Today it points at the locally built
# image; CI/GitOps will later rewrite newName/newTag to a registry image pinned
# by commit SHA, and Argo CD will sync that change to the cluster.
images:
  - name: aim-duel
    newName: ghcr.io/amine-lg/aim-duel   # lowercase for GHCR
    newTag: local                        # CI overwrites this with the commit SHA
