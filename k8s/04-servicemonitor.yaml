# Tells the Prometheus Operator (from kube-prometheus-stack) to scrape the
# aim-duel Service's metrics port. Requires the ServiceMonitor CRD to exist on
# the cluster — installed with kube-prometheus-stack — and Prometheus installed
# with prometheus.prometheusSpec.serviceMonitorSelectorNilUsesHelmValues=false
# so it discovers ServiceMonitors outside its own Helm release. Without that
# flag Prometheus silently ignores this and no metrics flow.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: aim-duel
  labels:
    app.kubernetes.io/name: aim-duel
    app.kubernetes.io/part-of: aim-duel
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: aim-duel
  endpoints:
    - port: metrics        # the Service port name (02-service.yaml), not a number
      path: /metrics
      interval: 30s
