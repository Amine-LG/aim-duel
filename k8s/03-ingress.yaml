apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aim-duel
  labels:
    app.kubernetes.io/name: aim-duel
    app.kubernetes.io/part-of: aim-duel
  annotations:
    # Socket.IO holds long-lived WebSocket connections. ingress-nginx upgrades
    # them automatically, but the default 60s proxy timeouts would cut idle
    # connections; raise them so matches and lobbies stay connected.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # cert-manager issues/renews the TLS cert into the secret named below, using
    # the ClusterIssuer created during cluster bootstrap. WSS replaces WS with no
    # app change. For a rate-limit-safe dry run, temporarily set this to
    # letsencrypt-staging, confirm the cert issues, then switch back to prod.
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - aminelg.xyz
      secretName: aim-duel-tls
  rules:
    - host: aminelg.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aim-duel
                port:
                  number: 80
