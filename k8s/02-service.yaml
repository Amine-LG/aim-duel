apiVersion: v1
kind: Service
metadata:
  name: aim-duel
  labels:
    app.kubernetes.io/name: aim-duel
    app.kubernetes.io/part-of: aim-duel
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: aim-duel
  ports:
    - name: http
      port: 80
      targetPort: http
    # Metrics port, exposed cluster-internally only. The ServiceMonitor's
    # endpoints[].port references this name; the ingress never routes it.
    - name: metrics
      port: 9091
      targetPort: metrics
